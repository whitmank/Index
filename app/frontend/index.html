<!doctype html>
<!-- Authored by Karter Whitman using Claude Opus 4.8 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Resource bytes arrive over res:/thumb:; scripts and styles only
         ever come from the bundle (or, in development, Vite's server,
         which needs 'unsafe-inline' for its injected client). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' res: thumb: data: blob:; media-src 'self' res: thumb: blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' res: thumb: ws://localhost:5273 http://localhost:5273; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>Index</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
